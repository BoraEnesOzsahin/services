##############################################################################
# Logstash Pipeline — receives Beats, enriches, and forwards to Elasticsearch
##############################################################################

input {
  beats {
    port => 5044
  }
}

filter {
  # ── Try to parse JSON-formatted log messages (Spring Boot ECS JSON logs) ──
  if [message] =~ /^\s*\{/ {
    json {
      source  => "message"
      target  => "parsed"
      add_tag => ["json_log"]
    }

    # ── Promote Spring Boot ECS JSON fields to proper ECS nested fields ──────
    # Spring Boot 3.4+ with `logging.structured.format.console: ecs` already
    # emits ECS-compliant JSON.  We lift the most common fields out of [parsed]
    # into their canonical ECS locations so that every document (regardless of
    # whether Filebeat decoded the JSON first) ends up with the same structure.

    # log.level
    if [parsed][log.level] {
      mutate { copy => { "[parsed][log.level]" => "[log][level]" } }
    } else if [parsed][level] {
      mutate { copy => { "[parsed][level]" => "[log][level]" } }
    }

    # log.logger
    if [parsed][log.logger] {
      mutate { copy => { "[parsed][log.logger]" => "[log][logger]" } }
    } else if [parsed][logger_name] {
      mutate { copy => { "[parsed][logger_name]" => "[log][logger]" } }
    }

    # service.name
    if [parsed][service][name] {
      mutate { copy => { "[parsed][service][name]" => "[service][name]" } }
    }

    # service.version
    if [parsed][service][version] {
      mutate { copy => { "[parsed][service][version]" => "[service][version]" } }
    }

    # event.dataset
    if [parsed][event][dataset] {
      mutate { copy => { "[parsed][event][dataset]" => "[event][dataset]" } }
    }

    # event.action
    if [parsed][event][action] {
      mutate { copy => { "[parsed][event][action]" => "[event][action]" } }
    }

    # event.outcome
    if [parsed][event][outcome] {
      mutate { copy => { "[parsed][event][outcome]" => "[event][outcome]" } }
    }

    # trace.id
    if [parsed][trace][id] {
      mutate { copy => { "[parsed][trace][id]" => "[trace][id]" } }
    }

    # transaction.id
    if [parsed][transaction][id] {
      mutate { copy => { "[parsed][transaction][id]" => "[transaction][id]" } }
    }

    # error.message
    if [parsed][error][message] {
      mutate { copy => { "[parsed][error][message]" => "[error][message]" } }
    }

    # error.stack_trace
    if [parsed][error][stack_trace] {
      mutate { copy => { "[parsed][error][stack_trace]" => "[error][stack_trace]" } }
    }

    # process.thread.name
    if [parsed][process][thread][name] {
      mutate { copy => { "[parsed][process][thread][name]" => "[process][thread][name]" } }
    } else if [parsed][thread_name] {
      mutate { copy => { "[parsed][thread_name]" => "[process][thread][name]" } }
    }

    # Promote the log body message if the parsed JSON had its own message field
    if [parsed][message] {
      mutate { copy => { "[parsed][message]" => "message" } }
    }
  }

  # ── Enrich with Docker / container metadata into ECS nested fields ────────
  # Filebeat's add_docker_metadata places data under [container][name] already,
  # but we also set the ECS service.name here as a fallback for sources
  # (PostgreSQL, Vault, etc.) whose logs are not Spring Boot ECS JSON.

  if [container][name] {
    # container.name  (already correct — Filebeat sets this)
    # host.name       (already set by add_host_metadata under [host][name])

    # service.name — derive from container name only if not already set by JSON
    if ![service][name] {
      mutate {
        copy => { "[container][name]" => "[service][name]" }
      }
    }

    # event.dataset — set per well-known container names if not already present
    if ![event][dataset] {
      if [container][name] == "postgresql" or [container][name] =~ /^postgres/ {
        mutate { add_field => { "[event][dataset]" => "postgresql.log" } }
      } else if [container][name] == "vault" {
        mutate { add_field => { "[event][dataset]" => "vault.audit" } }
      } else if [container][name] == "cold-wallet-manager" {
        mutate { add_field => { "[event][dataset]" => "cold-wallet-manager.application" } }
      } else if [container][name] == "hiveos-integration" {
        mutate { add_field => { "[event][dataset]" => "hiveos-integration.application" } }
      } else {
        # Generic fallback: <container-name>.log
        mutate { add_field => { "[event][dataset]" => "%{[container][name]}.log" } }
      }
    }
  }

  # ── Drop noisy heartbeat / health-check lines ─────────────────────────────
  if [message] =~ /actuator\/health|_cluster\/health/ {
    drop {}
  }

  # ── Remove the temporary [parsed] object and noisy metadata to keep documents clean ──────────
  mutate {
    remove_field => ["parsed", "agent", "host", "ecs", "container", "log", "input", "docker", "stream", "tags", "cloud"]
  }
}

output {
  elasticsearch {
    hosts  => ["http://elasticsearch:9200"]
    # One index per service per day  →  reckon-logs-<service>-YYYY.MM.DD
    index  => "reckon-logs-%{[service][name]}-%{+YYYY.MM.dd}"
    action => "index"
  }

  # Uncomment for local debugging:
  # stdout { codec => rubydebug }
}
