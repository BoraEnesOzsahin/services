server:
  port: 8080
  # honor X-Forwarded-Prefix from the gateway so Swagger UI works behind APISIX path prefixes
  forward-headers-strategy: framework

spring:
  application:
    name: gpu-monitoring-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://host.docker.internal:5432/gpu_monitoring_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  jackson:
    property-naming-strategy: SNAKE_CASE

  cloud:
    consul:
      host: ${CONSUL_HOST:host.docker.internal}
      port: ${CONSUL_PORT:8500}
      discovery:
        register: true
        deregister: true
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: /actuator/health
        health-check-interval: 30s
        health-check-critical-timeout: 90s

management:
  endpoints:
    web:
      exposure:
        include: health

node-token:
  secret: ${NODE_TOKEN_SECRET:change-this-secret-key-min-32-characters!!}
  expiration: ${NODE_TOKEN_EXPIRATION:2592000000}

gpu-monitoring:
  heartbeat-interval: ${HEARTBEAT_INTERVAL:60}
