services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gpu-monitoring-service:local
    network_mode: "host"
    environment:
      DB_URL: jdbc:postgresql://localhost:5432/gpu_monitoring_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CONSUL_HOST: localhost
      CONSUL_PORT: ${CONSUL_PORT:-8500}
      NODE_TOKEN_SECRET: ${NODE_TOKEN_SECRET:-change-this-secret-key-min-32-characters!!}
      NODE_TOKEN_EXPIRATION: ${NODE_TOKEN_EXPIRATION:-2592000000}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-60}
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gpu_monitoring_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gpu_monitoring_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  consul:
    image: hashicorp/consul:1.21
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0

volumes:
  postgres-data:
