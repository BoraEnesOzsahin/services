server:
  port: 8083

spring:
  application:
    name: UserAuthenticationService

  # Database Configuration (PostgreSQL)
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/auth_db}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # CORS / Docker Configuration
  docker:
    compose:
      enabled: false

# Swagger UI OAuth2 Configuration
springdoc:
  swagger-ui:
    oauth:
      client-id: ${SWAGGER_CLIENT_ID:swagger-client}
      use-pkce-with-authorization-code-grant: true
      use-basic-authentication-with-access-code-grant: false

# JWT Config
jwt:
  secret: 7c8f9b2d3e1a4f6c8b9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b
  expiration: 3600000

#
# dogrulama isini bırakıp zaten ıcerıde bır defa tokenım oldugu muddetce ben dogruluyum dıye varsayabılırız?
# yanı=dıger servıslerle haberlesıp de her request sonucu auth etmek ısı cok zahmetlı olabılır
# o yuzden dırekt bu auth servısı basta calısıtırıp sonradan usera dıger servıslerdekı ıslemlerı yaptırdıgımız ıcın
# dıger servıslere ıstek atan userımızı authlu sayalım.
