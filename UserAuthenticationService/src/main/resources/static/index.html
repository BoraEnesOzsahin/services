<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Auth UI</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #0B1D3A 0%, #000000 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Star background effect */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: transparent;
        }

        /* A simple representation of stars using box-shadow on a tiny div */
        .star-layer {
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 100px 200px white, 300px 400px white, 500px 100px white, 700px 500px white,
                        900px 200px white, 1100px 600px white, 1300px 300px white, 1500px 800px white,
                        200px 800px white, 400px 600px white, 600px 900px white, 800px 200px white,
                        1000px 400px white, 1200px 100px white, 1400px 700px white, 1600px 300px white;
            animation: animStar 50s linear infinite;
        }

        @keyframes animStar {
            from { transform: translateY(0px); }
            to { transform: translateY(-1000px); }
        }

        .auth-container {
            background: rgba(11, 29, 58, 0.7); /* Deep Azure Blue semi-transparent */
            border: 1px solid #1E90FF; /* Dodger Blue */
            border-radius: 12px;
            padding: 40px;
            width: 350px;
            box-shadow: 0 0 20px rgba(30, 144, 255, 0.5); /* Glowing blue effect */
            backdrop-filter: blur(5px);
            z-index: 1;
        }

        h2 {
            text-align: center;
            color: #00BFFF; /* Deep Sky Blue */
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #87CEFA; /* Light Sky Blue */
            font-size: 0.9em;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #4682B4; /* Steel Blue */
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            border-color: #00BFFF;
            box-shadow: 0 0 8px rgba(0, 191, 255, 0.6);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #1E90FF, #00BFFF);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(30, 144, 255, 0.8);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9em;
            min-height: 20px;
        }

        .success { color: #00FA9A; }
        .error { color: #FF6347; }

        .swagger-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #87CEFA;
            text-decoration: none;
            font-size: 0.8em;
        }

        .swagger-link:hover {
            color: white;
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div class="stars">
        <div class="star-layer"></div>
    </div>

    <div class="auth-container">
        <h2>Initiate Sequence</h2>

        <form id="registerForm">
            <div class="input-group">
                <label for="username">Commander ID (Username)</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="input-group">
                <label for="email">Comm-Link (Email)</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="input-group">
                <label for="password">Security Code (Password)</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Verify Security Code</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>

            <button type="submit" class="btn">Register Commander</button>
            <div id="messageBox" class="message"></div>
        </form>

        <a href="/swagger-ui.html" class="swagger-link">Access API Databanks (Swagger UI)</a>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const messageBox = document.getElementById('messageBox');

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                messageBox.textContent = "Security codes do not match.";
                messageBox.className = "message error";
                return;
            }

            messageBox.textContent = "Processing...";
            messageBox.className = "message";

            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password,
                confirmPassword: confirmPassword
            };

            try {
                const response = await fetch('/public/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    messageBox.textContent = "Registration Successful! Please check your email to confirm.";
                    messageBox.className = "message success";
                    this.reset();
                } else {
                    const errText = await response.text();
                    messageBox.textContent = errText || "Registration failed. Verify parameters.";
                    messageBox.className = "message error";
                }
            } catch (error) {
                messageBox.textContent = "Network error. Connection to mainframe lost.";
                messageBox.className = "message error";
            }
        });
    </script>
</body>
</html>
