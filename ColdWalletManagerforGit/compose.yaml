  # ── HashiCorp Vault ───────────────────────────────────────────────
  vault:
    image: 'hashicorp/vault:latest'
    ports:
      - '8200:8200'
    volumes:
      - vault-data:/vault/file
      - vault-logs:/vault/logs
      - ./vault-config.json:/vault/config/vault-config.json:ro
    environment:
      - SKIP_SETCAP=true
      - VAULT_API_ADDR=http://vault:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    entrypoint: vault
    command: server -config=/vault/config/vault-config.json
    cap_add:
      - IPC_LOCK
    networks:
      - app-network
      - reckon-ext-net
    labels:
      co.elastic.logs/enabled: "true"
      com.docker.compose.service: "vault"

  # ── Vault Initialisation (one-shot) ──────────────────────────────
  vault-init:
    image: 'hashicorp/vault:latest'
    depends_on:
      vault:
        condition: service_started
    volumes:
      - vault-data:/vault/file
      - vault-logs:/vault/logs
      - ./vault-init.sh:/vault-init.sh:ro
      - ./vault-audit-setup.sh:/vault-audit-setup.sh:ro
    environment:
      - VAULT_ADDR=http://vault:8200
    command: >
      /bin/sh -c "
        awk '{ sub(\"\\\\r$$\", \"\"); print }' /vault-init.sh > /tmp/init.sh &&
        awk '{ sub(\"\\\\r$$\", \"\"); print }' /vault-audit-setup.sh > /tmp/vault-audit-setup.sh &&
        sh /tmp/init.sh
      "
    networks:
      - app-network
      - reckon-ext-net
    labels:
      co.elastic.logs/enabled: "true"
      com.docker.compose.service: "vault-init"

  # Filebeat has been removed as it is now handled centrally by log-manager.

volumes:
  postgres-data:
  postgres-logs:
  vault-data:
  vault-logs:
  app-logs:
    name: reckon-app-logs
    external: true

networks:
  app-network:
    external: true
    name: reckon-arc
  reckon-ext-net:
    external: true
    name: reckon-ext-net
