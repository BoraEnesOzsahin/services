services:

  # ── Spring Boot Application ────────────────────────────────────────
  app:
    build: .
    ports:
      - '8081:8080'
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://host.docker.internal:5432/walletdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-admin123}
      - SPRING_CLOUD_VAULT_URI=http://vault:8200
      - SERVICE_ENVIRONMENT=${SERVICE_ENVIRONMENT:-development}
    depends_on:
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-data:/vault/file
      - app-logs:/app/logs
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        while [ ! -f /vault/file/role.id ] || [ ! -f /vault/file/secret.id ]; do
          echo 'Waiting for Vault AppRole credentials...';
          sleep 2;
        done;
        export VAULT_ROLE_ID=$$(cat /vault/file/role.id)
        export VAULT_SECRET_ID=$$(cat /vault/file/secret.id)
        java -jar /app/app.jar
    networks:
      - app-network
      - reckon-ext-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      co.elastic.logs/enabled: "true"
      co.elastic.logs/multiline.pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}"
      co.elastic.logs/multiline.negate:  "true"
      co.elastic.logs/multiline.match:   "after"
      com.docker.compose.service: "app"

