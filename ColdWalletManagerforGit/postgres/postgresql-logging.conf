# PostgreSQL configuration for structured operational logging
# Applied via environment variables in compose.yaml

# ── Log destination ──
log_destination = 'csvlog'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.csv'
log_file_mode = 0640
log_rotation_age = 1d
log_rotation_size = 100MB

# ── What to log ──
# 'none' in production; 'ddl' for schema change auditing; 'mod' for write auditing
# Never use 'all' in production (query params may contain secrets)
log_statement = 'none'

# Slow query logging — 1000ms threshold (tune via PG_LOG_MIN_DURATION_MS env var)
log_min_duration_statement = 1000

# Log connections and disconnections for audit trails
log_connections = on
log_disconnections = on

# Log authentication failures (always)
log_failed_connections = on

# ── What NOT to log ──
# Do not log query parameters — they may contain credentials or private data
log_parameter_max_length = -1
log_parameter_max_length_on_error = -1

# ── Lock waits ──
log_lock_waits = on
deadlock_timeout = 1s

# ── Error verbosity ──
log_min_messages = WARNING
log_min_error_statement = ERROR

# ── Timezone ──
log_timezone = 'UTC'
